# Standalone dependencies for working on this service alone.
name: ecommerce-notification-service

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notification_svc
      POSTGRES_PASSWORD: notification_local_pw
      POSTGRES_DB: notification_db
    ports: ["5446:5432"]
    volumes: ["notification-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_svc -d notification_db"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    ports: ["1025:1025", "8025:8025"]

volumes:
  notification-pg:
